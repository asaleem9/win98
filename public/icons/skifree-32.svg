<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Snow field -->
  <rect x="2" y="2" width="28" height="28" fill="#FFFFFF"/>
  <rect x="2" y="2" width="28" height="1" fill="#C0DCE8"/>
  <rect x="2" y="2" width="1" height="28" fill="#C0DCE8"/>
  <rect x="29" y="2" width="1" height="28" fill="#A0B8C8"/>
  <rect x="2" y="29" width="28" height="1" fill="#A0B8C8"/>
  <!-- Pine tree, upper right -->
  <rect x="23" y="5" width="2" height="2" fill="#007000"/>
  <rect x="22" y="7" width="4" height="2" fill="#008000"/>
  <rect x="21" y="9" width="6" height="2" fill="#007000"/>
  <rect x="20" y="11" width="8" height="2" fill="#008000"/>
  <rect x="23" y="13" width="2" height="2" fill="#804000"/>
  <!-- Skier: hat -->
  <rect x="10" y="7" width="4" height="2" fill="#0000A0"/>
  <!-- Skier: head -->
  <rect x="10" y="9" width="4" height="3" fill="#F0C8A0"/>
  <!-- Skier: yellow jacket, leaning downhill -->
  <rect x="9" y="12" width="6" height="5" fill="#F0D000"/>
  <rect x="8" y="13" width="1" height="3" fill="#F0D000"/>
  <rect x="15" y="14" width="2" height="2" fill="#F0D000"/>
  <!-- Skier: poles -->
  <rect x="7" y="12" width="1" height="8" fill="#808080"/>
  <rect x="17" y="13" width="1" height="8" fill="#808080"/>
  <!-- Skier: legs -->
  <rect x="10" y="17" width="2" height="4" fill="#303030"/>
  <rect x="13" y="17" width="2" height="4" fill="#303030"/>
  <!-- Skis -->
  <rect x="8" y="21" width="8" height="1" fill="#D00000"/>
  <rect x="11" y="22" width="8" height="1" fill="#D00000"/>
  <!-- Ski tracks -->
  <rect x="6" y="24" width="2" height="1" fill="#C8D8E0"/>
  <rect x="8" y="25" width="2" height="1" fill="#C8D8E0"/>
  <rect x="10" y="26" width="2" height="1" fill="#C8D8E0"/>
  <rect x="10" y="24" width="2" height="1" fill="#C8D8E0"/>
  <rect x="12" y="25" width="2" height="1" fill="#C8D8E0"/>
  <rect x="14" y="26" width="2" height="1" fill="#C8D8E0"/>
  <!-- Yeti peeking, bottom right -->
  <rect x="24" y="22" width="5" height="6" fill="#B8C8C8"/>
  <rect x="25" y="23" width="1" height="1" fill="#000000"/>
  <rect x="27" y="23" width="1" height="1" fill="#000000"/>
  <rect x="25" y="25" width="3" height="1" fill="#600000"/>
