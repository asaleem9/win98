<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- ICQ daisy: eight petals around a center -->
  <!-- Top petal (green) -->
  <rect x="13" y="3" width="6" height="6" fill="#58B848"/>
  <rect x="14" y="2" width="4" height="1" fill="#58B848"/>
  <!-- Bottom petal (green) -->
  <rect x="13" y="23" width="6" height="6" fill="#58B848"/>
  <rect x="14" y="29" width="4" height="1" fill="#58B848"/>
  <!-- Left petal (green) -->
  <rect x="3" y="13" width="6" height="6" fill="#58B848"/>
  <rect x="2" y="14" width="1" height="4" fill="#58B848"/>
  <!-- Right petal (red offline petal) -->
  <rect x="23" y="13" width="6" height="6" fill="#E03030"/>
  <rect x="29" y="14" width="1" height="4" fill="#E03030"/>
  <!-- Diagonal petals (white with outline) -->
  <rect x="6" y="6" width="6" height="6" fill="#FFFFFF"/>
  <rect x="6" y="6" width="6" height="1" fill="#B0B0B0"/>
  <rect x="6" y="6" width="1" height="6" fill="#B0B0B0"/>
  <rect x="20" y="6" width="6" height="6" fill="#FFFFFF"/>
  <rect x="20" y="6" width="6" height="1" fill="#B0B0B0"/>
  <rect x="25" y="6" width="1" height="6" fill="#B0B0B0"/>
  <rect x="6" y="20" width="6" height="6" fill="#FFFFFF"/>
  <rect x="6" y="25" width="6" height="1" fill="#B0B0B0"/>
  <rect x="6" y="20" width="1" height="6" fill="#B0B0B0"/>
  <rect x="20" y="20" width="6" height="6" fill="#FFFFFF"/>
  <rect x="20" y="25" width="6" height="1" fill="#B0B0B0"/>
  <rect x="25" y="20" width="1" height="6" fill="#B0B0B0"/>
  <!-- Center disc -->
  <rect x="11" y="11" width="10" height="10" fill="#FFD800"/>
  <rect x="12" y="10" width="8" height="1" fill="#FFD800"/>
  <rect x="12" y="21" width="8" height="1" fill="#FFD800"/>
  <rect x="10" y="12" width="1" height="8" fill="#FFD800"/>
  <rect x="21" y="12" width="1" height="8" fill="#FFD800"/>
  <rect x="12" y="12" width="3" height="2" fill="#FFF0A0"/>
</svg>
