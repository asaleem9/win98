  <rect x="18" y="20" width="4" height="8" fill="#108030"/>
  <rect x="26" y="20" width="4" height="8" fill="#108030"/>
  <rect x="19" y="21" width="2" height="1" fill="#40B060"/>
  <!-- Handset cord -->
  <rect x="14" y="26" width="2" height="2" fill="#083818"/>
