<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Monitor -->
  <rect x="4" y="4" width="22" height="16" fill="#C0C0B0"/>
  <rect x="4" y="4" width="22" height="1" fill="#E8E8D8"/>
  <rect x="4" y="4" width="1" height="16" fill="#E8E8D8"/>
  <rect x="25" y="4" width="1" height="16" fill="#787868"/>
  <rect x="4" y="19" width="22" height="1" fill="#787868"/>
  <!-- Screen: green terminal -->
  <rect x="6" y="6" width="18" height="12" fill="#001800"/>
  <rect x="7" y="7" width="8" height="1" fill="#00E000"/>
  <rect x="7" y="9" width="12" height="1" fill="#00A000"/>
  <rect x="7" y="11" width="10" height="1" fill="#00A000"/>
  <rect x="7" y="13" width="14" height="1" fill="#00A000"/>
