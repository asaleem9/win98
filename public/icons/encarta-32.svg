<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Gold book base -->
  <rect x="4" y="20" width="24" height="8" fill="#C89818"/>
  <rect x="4" y="20" width="24" height="1" fill="#F0C860"/>
  <rect x="4" y="27" width="24" height="1" fill="#907010"/>
  <rect x="15" y="20" width="2" height="8" fill="#907010"/>
  <!-- Book pages edge -->
  <rect x="5" y="18" width="10" height="2" fill="#F8F0D8"/>
  <rect x="17" y="18" width="10" height="2" fill="#F8F0D8"/>
  <!-- Globe -->
  <rect x="10" y="4" width="12" height="2" fill="#2050B0"/>
  <rect x="8" y="6" width="16" height="2" fill="#2858B8"/>
  <rect x="7" y="8" width="18" height="8" fill="#3068C8"/>
  <rect x="8" y="16" width="16" height="1" fill="#2858B8"/>
  <rect x="10" y="17" width="12" height="1" fill="#2050B0"/>
  <!-- Continents (green landmasses) -->
  <rect x="10" y="6" width="4" height="3" fill="#48A038"/>
  <rect x="12" y="9" width="3" height="2" fill="#48A038"/>
  <rect x="18" y="7" width="5" height="4" fill="#48A038"/>
  <rect x="17" y="11" width="3" height="2" fill="#48A038"/>
  <rect x="11" y="13" width="4" height="3" fill="#48A038"/>
  <rect x="20" y="13" width="3" height="3" fill="#48A038"/>
  <!-- Globe highlight -->
  <rect x="9" y="7" width="2" height="2" fill="#78A8E8"/>
  <!-- Meridian ring -->
  <rect x="6" y="11" width="20" height="1" fill="#F0C860"/>
</svg>
