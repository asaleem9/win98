<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Chat window -->
  <rect x="3" y="4" width="26" height="22" fill="#FFFFFF"/>
  <rect x="3" y="4" width="26" height="1" fill="#808080"/>
  <rect x="3" y="4" width="1" height="22" fill="#808080"/>
  <rect x="28" y="4" width="1" height="22" fill="#404040"/>
  <rect x="3" y="25" width="26" height="1" fill="#404040"/>
  <!-- Title bar -->
  <rect x="4" y="5" width="24" height="3" fill="#000080"/>
  <rect x="25" y="5" width="2" height="2" fill="#C0C0C0"/>
  <!-- Colored IRC chat lines -->
  <rect x="6" y="10" width="6" height="2" fill="#C00000"/>
  <rect x="13" y="10" width="12" height="2" fill="#000000"/>
  <rect x="6" y="13" width="4" height="2" fill="#008000"/>
  <rect x="11" y="13" width="14" height="2" fill="#000000"/>
  <rect x="6" y="16" width="5" height="2" fill="#0000C0"/>
  <rect x="12" y="16" width="10" height="2" fill="#000000"/>
  <rect x="6" y="19" width="7" height="2" fill="#800080"/>
  <rect x="14" y="19" width="8" height="2" fill="#000000"/>
  <!-- Input line -->
  <rect x="5" y="22" width="22" height="2" fill="#FFFFC0"/>
  <rect x="6" y="22" width="1" height="2" fill="#000000"/>
  <!-- Hash badge -->
  <rect x="20" y="26" width="10" height="6" fill="#FFD800"/>
  <rect x="22" y="27" width="1" height="4" fill="#000000"/>
  <rect x="25" y="27" width="1" height="4" fill="#000000"/>
  <rect x="21" y="28" width="6" height="1" fill="#000000"/>
  <rect x="21" y="30" width="6" height="1" fill="#000000"/>
</svg>
