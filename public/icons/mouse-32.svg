<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Mouse body -->
  <rect x="8" y="4" width="16" height="24" fill="#C0C0C0"/>
  <rect x="10" y="2" width="12" height="2" fill="#C0C0C0"/>
  <rect x="6" y="8" width="2" height="16" fill="#C0C0C0"/>
  <rect x="24" y="8" width="2" height="16" fill="#C0C0C0"/>
  <!-- Highlight -->
  <rect x="8" y="4" width="16" height="1" fill="#FFFFFF"/>
  <rect x="8" y="4" width="1" height="23" fill="#FFFFFF"/>
  <rect x="10" y="2" width="12" height="1" fill="#FFFFFF"/>
  <!-- Shadow -->
  <rect x="23" y="4" width="1" height="24" fill="#808080"/>
  <rect x="25" y="8" width="1" height="16" fill="#808080"/>
  <rect x="8" y="27" width="16" height="1" fill="#808080"/>
  <!-- Button split -->
  <rect x="15" y="4" width="2" height="9" fill="#808080"/>
  <!-- Scroll wheel -->
  <rect x="14" y="6" width="4" height="6" fill="#404040"/>
  <rect x="14" y="6" width="1" height="6" fill="#808080"/>
  <rect x="15" y="7" width="2" height="1" fill="#DFDFDF"/>
  <!-- Cable -->
  <rect x="15" y="0" width="2" height="2" fill="#404040"/>
</svg>
